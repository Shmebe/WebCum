# MediaMTX configuration for a V4L2 USB webcam on RK3399.
# The selected camera emits H.264 natively, so no video is re-encoded.

hlsVariant: lowLatency

paths:
  cam:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning
      -f v4l2
      -framerate 15
      -video_size 1920x1080
      -input_format h264
      -i /dev/camera
      -an
      -c:v copy
      -f rtsp
      -rtsp_transport tcp
      rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  # Published by the gesture-recognizer container.
  gestures: {}
